<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皮克敏香菇計時器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <img src="icons/icon48.png" width="28" height="28" alt="Pikmin Mushroom" class="header-icon-img" />
        <div>
          <h1>皮克敏香菇計時器</h1>
          <span class="subtitle">Pikmin Bloom Timer</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggle-settings-btn" class="btn-icon btn-gear" title="偏好設定">⚙️</button>
        <button id="toggle-add-btn" class="btn-icon" title="新增香菇">+</button>
      </div>
    </header>

    <!-- Settings Section (Collapsible) -->
    <section id="settings-section" class="settings-section">
      <div class="settings-title">⚙️ 偏好設定</div>

      <div class="setting-item">
        <div class="setting-label-row">
          <label for="mush-size-slider">網頁懸浮香菇尺寸</label>
          <span id="size-val-display" class="size-val-badge">58px</span>
        </div>
        <div class="slider-wrap">
          <span class="slider-hint">小</span>
          <input type="range" id="mush-size-slider" min="36" max="96" value="58" step="2" />
          <span class="slider-hint">大</span>
        </div>
        <div class="size-presets">
          <button type="button" class="preset-size-btn" data-size="42">🤏 小巧 42px</button>
          <button type="button" class="preset-size-btn active" data-size="58">🍄 預設 58px</button>
          <button type="button" class="preset-size-btn" data-size="74">🌟 醒目 74px</button>
          <button type="button" class="preset-size-btn" data-size="96">🦖 巨菇 96px</button>
        </div>
      </div>
    </section>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <span class="stat-item"><span class="dot battling"></span> 戰鬥中: <strong id="stat-battling">0</strong></span>
      <span class="stat-item"><span class="dot respawning"></span> 重生中: <strong id="stat-respawning">0</strong></span>
      <span class="stat-spacer"></span>
      <button id="clear-finished-btn" class="btn-text-link" title="清除所有已結束的香菇">清空已結束</button>
    </div>

    <!-- Quick Add Form (Collapsible/Drawer) -->
    <section id="add-form" class="add-section">
      <div class="form-title">🌱 新增香菇鬧鐘</div>

      <div class="form-group">
        <label for="mush-name">香菇名稱 / 地點</label>
        <input type="text" id="mush-name" placeholder="例如：中山站大紅菇、公司旁黃菇" />
      </div>

      <!-- Color Selector -->
      <div class="form-group">
        <label>香菇種類 / 顏色</label>
        <div class="color-picker-grid" id="color-picker">
          <button type="button" class="color-chip active" data-color="red" title="紅菇">🔴 紅</button>
          <button type="button" class="color-chip" data-color="yellow" title="黃菇">🟡 黃</button>
          <button type="button" class="color-chip" data-color="blue" title="藍菇">🔵 藍</button>
          <button type="button" class="color-chip" data-color="white" title="白菇">⚪ 白</button>
          <button type="button" class="color-chip" data-color="purple" title="紫菇">🟣 紫</button>
          <button type="button" class="color-chip" data-color="pink" title="粉/羽毛菇">🌸 粉</button>
          <button type="button" class="color-chip" data-color="gray" title="灰/岩石菇">🪨 灰</button>
          <button type="button" class="color-chip" data-color="special" title="特殊活動菇">✨ 特殊</button>
        </div>
      </div>

      <!-- Mode Selector: Duration vs End Time -->
      <div class="form-group">
        <div class="mode-tabs">
          <button type="button" class="tab-btn active" id="tab-duration">倒數剩餘時間</button>
          <button type="button" class="tab-btn" id="tab-endtime">指定結束時間</button>
        </div>

        <!-- Mode A: Duration Input -->
        <div id="duration-input-box" class="time-input-box">
          <div class="input-row">
            <div class="time-field">
              <input type="number" id="input-hours" min="0" max="99" value="1" placeholder="0" />
              <span>時</span>
            </div>
            <div class="time-field">
              <input type="number" id="input-minutes" min="0" max="59" value="30" placeholder="0" />
              <span>分</span>
            </div>
          </div>
          <div class="quick-presets">
            <button type="button" class="preset-btn" data-h="0" data-m="15">+15分</button>
            <button type="button" class="preset-btn" data-h="0" data-m="30">+30分</button>
            <button type="button" class="preset-btn" data-h="1" data-m="0">+1小時</button>
            <button type="button" class="preset-btn" data-h="2" data-m="0">+2小時</button>
            <button type="button" class="preset-btn" data-h="4" data-m="0">+4小時</button>
          </div>
        </div>

        <!-- Mode B: End Time Input -->
        <div id="endtime-input-box" class="time-input-box hidden">
          <div class="input-row">
            <input type="time" id="input-endtime" />
          </div>
          <span class="hint-text">選擇今日（或隔日）預計打完的時間</span>
        </div>
      </div>

      <!-- Respawn Setting -->
      <div class="form-group respawn-config">
        <label class="checkbox-label">
          <input type="checkbox" id="enable-respawn" checked />
          <span>戰鬥打完後，自動 +<input type="number" id="respawn-mins" value="5" min="1" max="60" class="mini-input" /> 分鐘重生提醒</span>
        </label>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="button" id="cancel-add-btn" class="btn-secondary">取消</button>
        <button type="button" id="submit-add-btn" class="btn-primary">🍄 開始計時</button>
      </div>
    </section>

    <!-- Mushroom List -->
    <main class="list-section">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">🌱</div>
        <p>目前沒有進行中的香菇</p>
        <span>點擊上方「+」快速新增一顆香菇吧！</span>
      </div>
      <div id="mushrooms-list" class="mushrooms-list"></div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>🔔 支援 Chrome 背景桌面推播通知</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
